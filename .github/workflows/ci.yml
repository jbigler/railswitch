name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make check
      # Again with dnsmasq on the host: a test that reads the host (the DNS
      # filter's check looks for a real dnsmasq) must not change with it.
      - name: Go tests with dnsmasq installed
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq dnsmasq-base
          go test -count=1 ./...

  quadlet:
    runs-on: ubuntu-latest
    # Moving tag: no tag of quay.io/podman/stable could be confirmed from the
    # dev sandbox (quay.io unreachable). Pin a major once one is confirmed.
    container: quay.io/podman/stable:latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -v -tags integration ./internal/render/ -run TestQuadletDryRun
        env:
          RAILSWITCH_QUADLET: /usr/libexec/podman/quadlet

  # The firewall hook under a real podman, crun and dnsmasq: crun starts
  # hooks with SIGTERM blocked, which unit tests' stand-ins can't show.
  firewall-live:
    runs-on: ubuntu-latest
    container:
      image: quay.io/podman/stable:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: dnf install -y -q dnsmasq nftables util-linux procps-ng
      - run: go test -v -count=1 -tags integration ./internal/firewall/ -run TestLiveDNSFilterEnds
        env:
          RAILSWITCH_LIVE_REQUIRED: "1"
