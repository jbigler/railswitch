name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" make build VERSION="$TAG"
            mv railswitch "dist/railswitch-linux-$arch"
          done
          (cd dist && sha256sum railswitch-linux-* > SHA256SUMS)
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes dist/railswitch-linux-amd64 dist/railswitch-linux-arm64 dist/SHA256SUMS
