name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write      # build provenance (attest-build-provenance)
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" make build VERSION="$TAG"
            mv railswitch "dist/railswitch-linux-$arch"
          done
          (cd dist && sha256sum railswitch-linux-* > SHA256SUMS)
      - name: Install staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          make check
          test "$(./dist/railswitch-linux-amd64 version)" = "railswitch $TAG"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/railswitch-linux-*
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes dist/railswitch-linux-amd64 dist/railswitch-linux-arm64 dist/SHA256SUMS
