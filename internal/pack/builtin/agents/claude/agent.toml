name = "claude"
version = 1
default = true                # railswitch project new adds this agent unless --agent is given
run = "on-demand"
entrypoint = "entrypoints/entrypoint-claude.sh"

# Firewall hosts (profile agent-claude, always enforced: D55).
allow = [
  "claude.ai",
  "api.anthropic.com",
  "statsig.com",
  "sentry.io",
  "registry.npmjs.org",       # chrome-devtools-mcp via npx
  "meta:github",
  "github.com",
  "api.github.com",
  "codeload.github.com",
]

[image]                       # built on the agent base image
file = "Containerfile.claude"

[[shared]]                    # plugins shared by every worktree
name = "claude_plugins_cache"
mount = "/home/appuser/.claude/plugins/cache"
chown = true

[[shared]]
name = "claude_plugins_marketplaces"
mount = "/home/appuser/.claude/plugins/marketplaces"
chown = true

[[mounts]]                    # copied to ~/.claude/railswitch.md by memory.sh
source = "CLAUDE.md"
target = "/opt/railswitch/agent/CLAUDE.md"
options = "ro,z"

[[mounts]]                    # run by the entrypoint: ~/.claude/CLAUDE.md imports railswitch.md
source = "memory.sh"
target = "/usr/local/bin/railswitch-memory"
options = "ro,z"

[[mounts]]                    # run by the entrypoint for a home that asks for the default (D135)
source = "apply-default.sh"
target = "/usr/local/bin/railswitch-apply-default"
options = "ro,z"

[[mounts]]                    # registered as a hook by the entrypoint (D58)
source = "claude-status-hook.sh"
target = "/usr/local/bin/claude-status-hook.sh"
options = "ro,z"

[[secrets]]                   # claude setup-token
name = "token"
env = "CLAUDE_CODE_OAUTH_TOKEN"

[config]                      # what `railswitch agent default promote` copies (D135)
paths = [
  ".claude/settings.json",      # theme, enabled plugins, permissions, hooks
  ".claude/keybindings.json",
  ".claude/statusline-command.sh",
  ".claude/CLAUDE.md",           # yours: imports railswitch.md, keeps other tools' lines
  ".claude/CLAUDE.local.md",
  ".claude/agents",
  ".claude/commands",
  ".claude/hooks",
  ".claude/skills",
  ".claude/output-styles",
  ".claude/plugins/known_marketplaces.json",
  ".claude/plugins/installed_plugins.json",
  ".claude.json",               # onboarding and preferences; the entrypoint keeps each home's projects
]

[env]
DISABLE_AUTOUPDATER = "1"

[unit]
tty = true
