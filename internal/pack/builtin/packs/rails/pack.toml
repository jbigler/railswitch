name = "rails"
version = 1

[app]
service = "rails"
server = "bin/dev"
port = 3000
health = "curl -fsS http://localhost:3000/up"   # Rails 7.1+ health route (D34)
health_start_period = "120s"
entrypoint = "entrypoints/entrypoint-app.sh"
deps_entrypoint = "entrypoints/entrypoint-deps.sh" # deps installs the lockfiles, frozen (D35); no install command

[deps]
frozen_env = { BUNDLE_FROZEN = "true" }         # set on the deps service; `railswitch deps` leaves it out (D35)

[image]                    # the base image (D31); app, deps and worker run it
file = "Containerfile.base"
tag = "ruby{ruby}-node{node}"
os = "debian"
args = { RUBY_VERSION = "{ruby}", NODE_VERSION = "{node}", BUN_VERSION = "{bun}" }

[runtimes.ruby]
from = [".ruby-version", ".tool-versions:ruby", "Gemfile", "Gemfile.lock"]
fallback = "3.4.2"

[runtimes.node]
from = [".nvmrc", ".node-version", ".tool-versions:nodejs", "package.json"]
fallback = "22.11.0"

[runtimes.bun]             # no fallback: an app that pins no bun version gets no bun in its image (D69)
from = [".bun-version", ".tool-versions:bun", "package.json:packageManager.bun"]

[runtimes.playwright]
from = ["Gemfile.lock:playwright-ruby-client"]
fallback = "1.60.0"

[db_name]
from = ["config/database.yml:development.database"]
fallback = "{project.prefix}_development"

[env]                      # only what Rails itself reads; app-specific names go in the project's [env]
RAILS_ENV = "development"
BINDING = "0.0.0.0"
RUBY_DEBUG_HOST = "0.0.0.0"  # the debug port is published, so the debug gem listens on every container address
# Rails' development host check allows only one subdomain under .localhost, so
# it answers 403 for <slug>.<prefix>.localhost unless the host is added here.
RAILS_DEVELOPMENT_HOSTS = "{worktree.host}"

[share]                    # layer 7: only while the worktree is shared on the tailnet (D46)
env = { RAILS_DEVELOPMENT_HOSTS = "{worktree.host},{share.host}" }

[db_scheme]
postgres = "postgres://"
mysql = "mysql2://"
mariadb = "mysql2://"

[[caches]]                 # shared across worktrees: <prefix>_<name>
name = "gems_ruby{ruby}"
mount = "/usr/local/bundle"
chown = false

[[caches]]
name = "npm_cache"
mount = "/home/appuser/.npm"
chown = true

[[worktree_volumes]]       # per worktree: <prefix>-<slug>-<name>
name = "node-modules"
mount = "/app/node_modules"
chown = true

[[ports]]
name = "debug"
env = "RUBY_DEBUG_PORT"
base = 33000
same_port = true          # the container port is the host port, so RUBY_DEBUG_PORT is right inside the container too

[[ports]]
name = "app"
env = "APP_PORT"
base = 13000
container = 3000
share = true               # served on tailnet HTTPS port 13000+ID by railswitch share (D46)

[defaults]
database = "postgres@1"
cache = "redis@1"
storage = "none"
jobs = "none"
mail = "none"
browser = "none"           # opt-in: --option browser=playwright@1

[tasks]
console = "bin/rails console"
test = "bin/rails test"
"test:system" = "bin/rails test:system"

[[links]]
label = "Mailer previews"
url = "{worktree.host}/rails/mailers"

[[links]]
label = "Routes"
url = "{worktree.host}/rails/info/routes"

[detect]                   # D87: railswitch project detect suggests this pack for a repo with every file
files = ["Gemfile", "config/application.rb"]

[unit]
# stdin stays open (no tty, so no colour codes in the logs): a Procfile's
# tailwindcss:watch ends at stdin's EOF, and foreman then stops the app
interactive = true
