# The built-in modern set: cyberpunk's light mode. The kit's pieces in white,
# oak and aluminium by daylight (tools/office-kit/theme_modern.py builds it).
schema = 1
name = "modern"
version = 1
pieces = 1
description = "White, oak and daylight"

[look]
mode = "light"          # a daytime sky and skyline, a bright room
background = "#bcd9ee"
fog = "#dfe9ef"
fog_density = 0.006
ambient = "#ffffff"
ambient_intensity = 1   # in light mode the hemisphere's own level, walking and overview alike
key = "#fff1d6"         # the sun through the windows
key_intensity = 0.8
bloom = 0
scanlines = false
