schema = 1

[project]
name        = "minimal"
prefix      = "mini"
base_branch = "master"

[stack]
pack = "rails@1"
app  = "rails"

[options]
database = "none"
cache    = "none"
browser  = "none"

[image]
base = "containerfiles/Containerfile.base"

[[routes]]          # vite.<slug>.mini.localhost → the app's Vite dev server (D67)
name    = "vite"
service = "rails"
port    = 3036
